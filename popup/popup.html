<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <link rel="stylesheet" href="popup.css">
  <title>Promoscope</title>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="app-title">Promoscope</h1>
    </header>

    <!-- Timer Section -->
    <section class="timer-section">
      <span class="status-label" data-i18n="workLabel">Work</span>
      <div class="timer-display">
        <span id="timer-minutes">25</span><span class="timer-colon">:</span><span id="timer-seconds">00</span>
      </div>
      <div class="pomodoro-dots" id="pomodoro-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="timer-controls">
        <button id="btn-start" class="btn btn-primary" data-i18n="startBtn">Start</button>
        <button id="btn-pause" class="btn btn-secondary" data-i18n="pauseBtn" hidden>Pause</button>
        <button id="btn-reset" class="btn btn-ghost" data-i18n="resetBtn">Reset</button>
      </div>
    </section>

    <!-- Session Report Section -->
    <section class="report-section">
      <h2 class="section-title" data-i18n="sessionReport">Session Report</h2>
      <div id="report-content" class="report-content">
        <p id="report-empty" class="empty-state" data-i18n="noSessions">No sessions yet. Start your first Pomodoro!</p>
        <div id="report-chart-wrapper" class="chart-wrapper" hidden>
          <canvas id="sessionChart"></canvas>
        </div>
        <div id="report-top-sites" class="top-sites-list"></div>
      </div>
    </section>

    <!-- Today Stats Section -->
    <section class="stats-section">
      <h2 class="section-title" data-i18n="todayStats">Today</h2>
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-value" id="stat-rounds">0</span>
          <span class="stat-label" data-i18n="rounds">rounds</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total-work">0m</span>
          <span class="stat-label" data-i18n="totalWork">Total Work</span>
        </div>
      </div>
      <div id="today-top-sites" class="today-top-sites"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <button id="btn-settings" class="footer-link" data-i18n="settings">Settings</button>
    </footer>
  </div>

  <script src="../utils/storage.js"></script>
  <script src="../libs/chart.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
