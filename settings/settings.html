<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="settingsTitle">Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="page-title" data-i18n="settingsTitle">Settings</h1>
    </header>

    <div class="settings-card">
      <div class="form-group">
        <label class="form-label" for="workDuration" data-i18n="workDurationLabel">Work Duration (minutes)</label>
        <input class="form-input" type="number" id="workDuration" min="1" max="60" value="25">
      </div>

      <div class="form-group">
        <label class="form-label" for="breakDuration" data-i18n="breakDurationLabel">Break Duration (minutes)</label>
        <input class="form-input" type="number" id="breakDuration" min="1" max="30" value="5">
      </div>

      <div class="form-group">
        <label class="form-label" for="longBreakDuration" data-i18n="longBreakDurationLabel">Long Break Duration (minutes)</label>
        <input class="form-input" type="number" id="longBreakDuration" min="1" max="60" value="15">
      </div>

      <div class="form-group">
        <label class="form-label" for="longBreakInterval" data-i18n="longBreakIntervalLabel">Long Break Every (rounds)</label>
        <input class="form-input" type="number" id="longBreakInterval" min="1" max="10" value="4">
      </div>

      <div class="form-group form-group-toggle">
        <label class="form-label" for="soundEnabled" data-i18n="soundEnabledLabel">Sound Notifications</label>
        <label class="toggle-switch">
          <input type="checkbox" id="soundEnabled" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="save-indicator" id="saveIndicator" hidden>
      <span data-i18n="savedLabel">Saved</span>
    </div>
  </div>

  <script src="../utils/storage.js"></script>
  <script src="settings.js"></script>
</body>
</html>
